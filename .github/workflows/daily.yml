name: Daily moon message
on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC = 07:00 Dubai
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node daily.js
      - name: Commit changes
        run: |
          git config user.name "moon-bot"
          git config user.email "moon-bot@users.noreply.github.com"
          git add today.txt
          git diff --staged --quiet || git commit -m "Daily moon message" && git push
